name: pysnt-gui
channels:
  - conda-forge
  - defaults
dependencies:
  # Core runtime dependencies
  - python>=3.11
  - openjdk=21
  - scyjava>=1.12.3
  - pyimagej>=1.7.0
  - jpype1>=1.5.0
  - numpy>=1.26
  - matplotlib>=3.8
  - xarray>=2023.12
  - pandas>=2.1

  # Optional display and conversion features
  - psutil>=5.9
  - networkx>=3.0
  - cairo>=1.16
  - cairosvg>=2.7
  - pymupdf>=1.24.3

  # IPython notebooks
  - ipykernel>=6.0

  # Pip dependencies
  - pip
  - pip:
    # Interactive GUI features
    - pyobjc-core>=10.0; sys_platform == "darwin"
    - pyobjc-framework-cocoa>=10.0; sys_platform == "darwin"

    # Optional Java auto-install support
    - install-jdk>=1.0
