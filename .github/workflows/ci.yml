name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  # Tests that need a JVM skip themselves if SNT cannot be resolved from Maven
  # (e.g., while the targeted SNT is an unreleased snapshot)

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Maven/jgo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.jgo
            ~/.cache/jgo
          key: jgo-${{ runner.os }}-${{ hashFiles('src/pysnt/_endpoints.py') }}
          restore-keys: jgo-${{ runner.os }}-
      - name: Install
        # pyobjc (extra "gui") is interactive-only and heavy: not needed here
        run: pip install -e ".[display,zarr,info]" pytest pytest-cov pytest-timeout nbclient typing_extensions
      - name: Warm up SNT download
        # First start resolves SNT's whole Maven dependency tree (many minutes on a cold runner):
        # do it once here, outside the per-test timeout. Also exercises the documented user flow
        timeout-minutes: 25
        run: python -c "import pysnt; pysnt.initialize(source='maven'); print(pysnt.snt_version())"
      - name: Test
        # A test stuck for 5 min is aborted with the stack of every thread (thread method also
        # works on Windows); -v names each test so a stall is easy to locate in the log.
        # -p no:faulthandler: the JVM triggers (handled, harmless) access violations while starting
        # on Windows, which pytest's faulthandler would print as "fatal exception" dumps
        run: python -m pytest tests -v -rs --timeout=300 --timeout-method=thread -p no:faulthandler

  minimum-versions:
    name: Tests (lowest declared dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v5
      - name: Cache Maven/jgo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.jgo
            ~/.cache/jgo
          key: jgo-${{ runner.os }}-${{ hashFiles('src/pysnt/_endpoints.py') }}
          restore-keys: jgo-${{ runner.os }}-
      - name: Install the oldest versions allowed by pyproject.toml
        run: |
          uv venv
          # lowest-direct applies to every direct requirement given on the command line, so it
          # must only see PySNT's own declared dependencies (unpinned test tools would resolve
          # to ancient releases that cannot even build)
          uv pip install --resolution lowest-direct -e ".[display,zarr,info]"
          # Test tooling: regular (latest) resolution; already-installed floors are kept
          uv pip install pytest pytest-cov nbclient typing_extensions
      - name: Test
        run: .venv/bin/python -m pytest tests -q -rs

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[docs,display]"
      - name: Build HTML (notebooks are not executed, nb_execution_mode is off)
        working-directory: docs
        run: python -m sphinx -b html . _build/html --keep-going

  package:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and inspect
        run: |
          pip install build
          python -m build
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.endswith("pysnt/py.typed") for n in names), "py.typed missing"
          assert any(n.endswith("pysnt/__init__.pyi") for n in names), "stubs missing"
          print(whl, len(names), "files; stubs and py.typed present")
          PY
