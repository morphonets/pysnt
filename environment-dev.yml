name: pysnt-dev
channels:
  - conda-forge
  - defaults
dependencies:
  # Core runtime dependencies
  - python>=3.11
  - openjdk=21
  - scyjava>=1.12.3
  - pyimagej>=1.7.0
  - jpype1>=1.5.0
  - numpy>=1.26
  - matplotlib>=3.8
  - xarray>=2023.12
  - pandas>=2.1

  # Optional display and conversion features
  - psutil>=5.9
  - networkx>=3.0
  - cairo>=1.16
  - cairosvg>=2.7
  - pymupdf>=1.24.3

  # Tutorial notebooks (docs/notebooks): napari (T02), trimesh stack (T05),
  # scikit-learn and SciPy (T06, T07). manifold3d is pip-only (see below)
  - napari
  - pyqt
  - trimesh
  - rtree
  - scipy
  - scikit-learn

  # Pip dependencies
  - pip
  - pip:
    # Optional Java auto-install support
    - install-jdk>=1.0

    # Tutorial notebooks: boolean operations in T05 (not on conda-forge)
    - manifold3d

    # Optional GUI dependencies
    - pyobjc-core>=10.0; sys_platform == "darwin"
    - pyobjc-framework-cocoa>=10.0; sys_platform == "darwin"
    
    # Notebook support
    - ipykernel>=6.0
    
    # Testing dependencies
    - pytest>=8.0
    - pytest-cov
    
    # Code quality dependencies
    - black
    - flake8
    - mypy
    - isort
    
    # Documentation dependencies
    - sphinx>=5.0,<9.0
    - sphinx-design
    - myst-nb>=0.15.0,<1.5.0
    - sphinx-copybutton
    - pydata-sphinx-theme
