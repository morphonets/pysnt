name: pysnt
channels:
  - conda-forge
  - defaults
dependencies:
  # Core runtime dependencies
  - python>=3.11
  - openjdk=21
  - scyjava>=1.12.1
  - pyimagej>=1.7.0
  - jpype1>=1.5.0
  - numpy>=1.26
  - matplotlib>=3.8
  - xarray>=2023.12
  - pandas>=2.1

  # Pip dependencies (runtime only)
  - pip
