[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysnt"
dynamic = ["version"]
authors = [
    {name = "SNT contributors"},
]
description = "Python interface for SNT, the framework for quantification of neuronal anatomy"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# Floors are the oldest versions PySNT is expected to work with; the CI "minimum" job
# (installing exactly these) keeps them honest. Upper bounds only where something breaks.
dependencies = [
    "scyjava>=1.12.5",  # 1.12.1/2 import a jgo name removed in jgo 2.x
    "pyimagej>=1.8.0",
    "JPype1>=1.7.1",
    "numpy>=2.4.6",
    "matplotlib>=3.11.2",
    "xarray>=2026.9.0",
    "pandas>=3.1.1",
]

[project.optional-dependencies]
# Enhanced display and conversion features (SVG conversion also needs the native cairo library)
display = [
    "networkx>=3.6.1",
    "cairosvg>=2.9.1",
    "PyMuPDF>=2.1",
]
# Interactive GUI features
gui = [
    "ipykernel>=7.4.0",
    "pyobjc-core>=13.0; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=13.0; sys_platform == 'darwin'",
]
# Optional Java auto-install support (scyjava can also fetch a JDK on its own)
java = [
    "install-jdk>=1.1.0",
]
# Visualization of reconstructions in napari (see tutorial T02)
napari = [
    "napari[all]",
]
# Memory/CPU details in pysnt.version(detailed=True)
info = [
    "psutil>=7.2.2",
]
# All optional features
all = [
    "pysnt[display,gui,java,info]",
]
# Development dependencies
dev = [
    "pysnt[all,napari]",
    "pytest>=9.2.0",
    "pytest-cov",
    "nbclient",
    "black",
    "flake8",
    "mypy",
    "isort",
    "typing_extensions",
    # Packages required by the tutorial notebooks (docs/notebooks)
    "trimesh",
    "manifold3d",
    "rtree",
    "scipy",
    "scikit-learn",
]
# Documentation dependencies
docs = [
    "sphinx>=9.0.4,<10.0",
    "sphinx-design",
    "myst-nb>=1.4.0,<1.5.0",
    "sphinx-copybutton",
    "pydata-sphinx-theme",
]

[project.scripts]
pysnt = "pysnt.__main__:main"

[project.urls]
Homepage = "https://github.com/morphonets/pysnt"
Repository = "https://github.com/morphonets/pysnt"
Documentation = "https://pysnt.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.dynamic]
version = {attr = "pysnt.__version__"}

# Ship type stubs (.pyi) and the PEP 561 marker with the wheel
[tool.setuptools.package-data]
pysnt = ["py.typed", "**/*.pyi", "*.pyi"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
